<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Opus 48 — 고전음악회 48주년 홈커밍데이</title>
<meta name="description" content="한양대학교 고전음악회 48주년 홈커밍데이에 선배님을 모십니다. 2026년 11월 21일(토) 오후 4시, 고전음악회 감상실.">
<meta property="og:type" content="website">
<meta property="og:title" content="Opus 48 — 고전음악회 48주년 홈커밍데이">
<meta property="og:description" content="선배님께 한 통의 초대장이 도착했습니다. 2026. 11. 21 (토) 16:00 · 고전음악회 감상실 B120">
<meta name="theme-color" content="#0E0E0D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230E0E0D'/%3E%3Crect x='7' y='6' width='8' height='20' fill='%23F3EFE6'/%3E%3Ccircle cx='21' cy='10' r='4' fill='%23F3EFE6'/%3E%3Crect x='17' y='15.5' width='8' height='10.5' fill='%23F3EFE6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Noto+Serif+KR:wght@300;400;600&display=swap">
<style>
:root{--ink:#0E0E0D;--paper:#F3EFE6;--muted:#A8A397;--soft:#C9C4B8;--line:#3A3833;--accent:#C4A66E}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--paper)}
body{font-family:'Noto Serif KR',serif;word-break:keep-all;-webkit-font-smoothing:antialiased}
.en{font-family:'Cormorant Garamond',serif}
a{color:var(--paper)}
.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:clamp(20px,3vw,36px) clamp(16px,5vw,64px)}
.brand{display:flex;align-items:center;gap:12px;font-size:14px;letter-spacing:.1em}
.mark{display:flex;gap:3px;width:24px;height:28px;color:var(--paper)}
.mark>i{flex:1;background:currentColor}
.mark>span{flex:1;display:flex;flex-direction:column;gap:3px}
.mark>span>b{aspect-ratio:1;border-radius:50%;background:currentColor}
.mark>span>i{flex:1;background:currentColor}
.label{font-style:italic;font-size:16px;color:var(--muted)}
main{position:relative;flex:1;display:flex;align-items:center;justify-content:center;padding:24px clamp(16px,5vw,64px) 32px}
.stack{display:flex;flex-direction:column;align-items:center;text-align:center}
.kicker{font-size:13px;letter-spacing:clamp(.16em,.6vw,.42em);text-transform:uppercase;color:var(--accent)}
.staff{position:absolute;left:0;right:0;top:50%;display:flex;flex-direction:column;gap:14px;opacity:.5;pointer-events:none}
.staff>div{height:1px;background:#24231F}
/* animation */
@keyframes fu{from{opacity:0;transform:translateY(22px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(196,166,110,0)}50%{box-shadow:0 0 0 10px rgba(196,166,110,.12)}}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}
.fu{opacity:0;animation:fu 1.1s cubic-bezier(.2,.7,.1,1) forwards}
.fade{opacity:0;animation:fade 1.6s ease forwards}
.draw{transform:scaleX(0);transform-origin:left;animation:draw 1.6s cubic-bezier(.6,0,.2,1) forwards}
.draw-c{transform:scaleX(0);transform-origin:center;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
.rise{opacity:0;animation:rise 1.2s cubic-bezier(.2,.7,.1,1) forwards}
/* envelope */
.env{position:relative;width:min(440px,84vw);aspect-ratio:1.5;animation:float 5s ease-in-out infinite}
.env-back{position:absolute;inset:0;background:#DDD6C7}
.env-letter{position:absolute;left:7%;right:7%;top:7%;bottom:6%;z-index:2;background:#FBF9F4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#1A1916;transition:transform 1.1s cubic-bezier(.3,.7,.2,1) .55s}
.env-letter small{font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:#5C574D}
.env-letter strong{font-style:italic;font-weight:400;font-size:44px;line-height:1}
.env-front{position:absolute;inset:0;z-index:3;background:var(--paper);clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.env-flap{position:absolute;left:0;right:0;top:0;height:58%;z-index:4;background:#E9E3D6;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s cubic-bezier(.6,0,.3,1),z-index 0s .4s}
.seal{position:absolute;left:50%;top:58%;z-index:5;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;background:#111;display:flex;align-items:center;justify-content:center;transition:opacity .45s,transform .45s;animation:glow 2.6s ease-in-out infinite}
.seal .mark{width:18px;height:22px;gap:2px;color:var(--accent)}
.seal .mark>span{gap:2px}
.env.open{animation:none}
.env.open .seal{opacity:0;transform:scale(.5)}
.env.open .env-flap{transform:rotateX(180deg);z-index:1}
.env.open .env-letter{transform:translateY(-58%)}
/* buttons */
.btn{font-family:'Noto Serif KR',serif;display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 36px;background:transparent;color:var(--paper);border:1px solid #6B675E;font-size:15px;letter-spacing:.22em;cursor:pointer;text-decoration:none;transition:background .4s,color .4s,border-color .4s;-webkit-tap-highlight-color:transparent}
.btn:hover{background:var(--paper);color:#111;border-color:var(--paper)}
.btn-solid{background:var(--paper);color:#111;border-color:var(--paper)}
.btn-solid:hover{background:var(--accent);border-color:var(--accent)}
.btn-ghost{border-color:transparent;color:var(--muted)}
.btn-ghost:hover{background:transparent;color:var(--paper);border-color:transparent}
.btn:focus-visible{outline:1px solid var(--accent);outline-offset:4px}
/* nav */
footer.nav{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;padding:20px clamp(16px,5vw,64px) calc(clamp(24px,3vw,40px) + env(safe-area-inset-bottom))}
footer.nav[hidden]{display:none}
.dots{display:flex;align-items:center;gap:8px}
.dots i{display:block;width:12px;height:2px;background:var(--line);transition:width .5s,background .5s}
.dots i.on{width:28px;background:var(--accent)}
.left{display:flex;justify-content:flex-start}.right{display:flex;justify-content:flex-end}
/* content */
.title-xl{margin:0;font-weight:400;font-style:italic;line-height:.9;letter-spacing:-.02em}
.prog{width:100%;max-width:600px;margin:0 auto;display:flex;flex-direction:column}
.row{display:flex;align-items:baseline;gap:clamp(16px,4vw,32px);padding:clamp(16px,2.4vh,22px) 0;text-align:left}
.row .num{flex:0 0 auto;width:clamp(36px,5vw,48px);font-size:clamp(24px,2.6vw,30px);color:var(--accent)}
.row .txt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:4px}
.row .t{font-style:italic;font-size:clamp(21px,2.2vw,24px)}
.row .d{font-size:clamp(14px,1.2vw,16px);font-weight:300;color:var(--soft)}
.hr{height:1px;background:var(--line)}
.info{width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:32px}
.info>div{display:flex;flex-direction:column;gap:10px}
.info .k{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
.info .v{font-size:19px}
.info .s{font-size:14px;font-weight:300;color:var(--muted)}
.info a{color:var(--muted);text-decoration:none}
.nw{white-space:nowrap}
@media (max-width:640px){.d-only{display:none}.btn{padding:0 22px;letter-spacing:.12em}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="app">
<header class="top fade">
<div class="brand"><span class="mark" aria-hidden="true"><i></i><span><b></b><i></i></span></span>고전음악회</div>
<span class="label en" id="label">Overture</span>
</header>
<main id="stage" aria-live="polite"></main>
<footer class="nav fade" id="nav" hidden>
<div class="left"><button type="button" class="btn btn-ghost" id="prev">이전</button></div>
<div class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="right"><button type="button" class="btn" id="next">다음</button><button type="button" class="btn btn-ghost" id="restart" hidden>처음으로</button></div>
</footer>
</div>

<template id="s0">
<div class="stack" style="gap:44px">
<div class="staff" aria-hidden="true"><div class="draw" style="animation-delay:.1s"></div><div class="draw" style="animation-delay:.25s"></div><div class="draw" style="animation-delay:.4s"></div><div class="draw" style="animation-delay:.55s"></div><div class="draw" style="animation-delay:.7s"></div></div>
<div class="stack" style="gap:14px">
<span class="kicker en fu" style="animation-delay:.3s">2026. 11. 21 · Since 1978</span>
<span class="fu" style="font-size:clamp(15px,1.4vw,18px);font-weight:300;letter-spacing:clamp(.06em,.4vw,.2em);color:var(--soft);animation-delay:.6s">선배님께 한 통의 초대장이 도착했습니다</span>
</div>
<div class="rise" style="animation-delay:.9s">
<div class="env" id="env">
<div class="env-back"></div>
<div class="env-letter en"><small>Homecoming</small><strong>Opus 48</strong></div>
<div class="env-front"></div>
<div class="env-flap"></div>
<div class="seal"><span class="mark" aria-hidden="true"><i></i><span><b></b><i></i></span></span></div>
</div>
</div>
<div class="fu" style="animation-delay:1.5s"><button type="button" class="btn" id="open">초대장 열기</button></div>
</div>
</template>

<template id="s1">
<div style="width:100%;max-width:680px;display:flex;flex-direction:column;gap:32px">
<div class="stack" style="gap:22px">
<span class="kicker en fu" style="animation-delay:.1s">The Forty-Eighth Homecoming</span>
<h1 class="title-xl en fu" style="font-size:clamp(72px,11vw,150px);animation-delay:.3s">Opus 48</h1>
<div class="draw-c" style="width:120px;height:1px;background:var(--accent);animation-delay:.8s"></div>
<p class="fu" style="margin:0;font-size:clamp(20px,2.2vw,28px);font-weight:300;letter-spacing:.06em;animation-delay:1s">고전음악회 48주년 홈커밍데이</p>
</div>
<div style="display:flex;flex-direction:column;gap:16px;text-align:center;font-size:clamp(15px,1.2vw,17px);font-weight:300;line-height:2;color:var(--soft)">
<p class="fu" style="margin:0;animation-delay:1.5s">1978년 문을 연 고전음악회가 올해로 마흔여덟 번째 해를 맞이했습니다.<br class="d-only"> 같은 곡을 듣고도 저마다 다른 이야기를 나누던 그 시간들이 모여, 지금의 우리가 되었습니다.</p>
<p class="fu" style="margin:0;animation-delay:2s">지나온 악장을 함께 돌아보고, 다음 악장을 함께 열고자 합니다.<br class="d-only"> 귀한 걸음 하시어 자리를 빛내 주시기를 청합니다.</p>
<p class="fu" style="margin:0;padding-top:8px;font-size:15px;color:var(--paper);letter-spacing:.06em;animation-delay:2.5s">한양대학교 고전음악회 회원 일동</p>
</div>
</div>
</template>

<template id="s2">
<div style="width:100%;max-width:760px;display:flex;flex-direction:column;gap:40px">
<div class="stack" style="gap:12px">
<span class="kicker en fu" style="animation-delay:.1s">Programme</span>
<h2 class="fu" style="margin:0;font-size:clamp(24px,2.6vw,34px);font-weight:300;letter-spacing:.04em;animation-delay:.25s">오늘의 순서</h2>
<span class="fu" style="font-size:14px;font-weight:300;letter-spacing:.08em;color:var(--muted);animation-delay:.4s">11월 21일 토요일 오후 4시 개회</span>
</div>
<div class="prog">
<div class="hr draw" style="animation-delay:.3s"></div>
<div class="row fu" style="animation-delay:.5s"><span class="num en">I.</span><div class="txt"><span class="t en">Prelude</span><span class="d">개회 및 활동 보고</span></div></div>
<div class="hr draw" style="animation-delay:.55s"></div>
<div class="row fu" style="animation-delay:.75s"><span class="num en">II.</span><div class="txt"><span class="t en">Andante</span><span class="d">고전음악회 48주년 기념 연주회</span></div></div>
<div class="hr draw" style="animation-delay:.8s"></div>
<div class="row fu" style="animation-delay:1s"><span class="num en">III.</span><div class="txt"><span class="t en">Scherzo</span><span class="d">고음 퀴즈 및 레크리에이션</span></div></div>
<div class="hr draw" style="animation-delay:1.05s"></div>
<div class="row fu" style="animation-delay:1.25s"><span class="num en">IV.</span><div class="txt"><span class="t en">Finale</span><span class="d">만찬 및 담소</span></div></div>
<div class="hr draw" style="animation-delay:1.4s"></div>
</div>
</div>
</template>

<template id="s3">
<div class="stack" style="width:100%;max-width:820px;gap:48px">
<div class="stack" style="gap:18px">
<span class="kicker en fu" style="animation-delay:.1s">Save the Date</span>
<span class="en fu" style="font-size:clamp(64px,10vw,136px);line-height:1;letter-spacing:.02em;animation-delay:.3s">11. 21</span>
<span class="fu" style="font-size:18px;font-weight:300;letter-spacing:.06em;color:var(--soft);animation-delay:.55s"><span class="nw">2026년 11월 21일 토요일</span> <span class="nw">· 오후 4시</span></span>
</div>
<div class="draw-c" style="width:100%;height:1px;background:var(--line);animation-delay:.8s"></div>
<div class="info">
<div class="fu" style="animation-delay:1s"><span class="k en">Venue</span><span class="v">고전음악회 감상실</span><span class="s">한양대학교 대운동장 지하 1층 B120</span></div>
<div class="fu" style="animation-delay:1.2s"><span class="k en">R.S.V.P.</span><span class="v">11월 15일(일)까지</span><span class="s">참석 여부 회신</span></div>
<div class="fu" style="animation-delay:1.4s"><span class="k en">Contact</span><span class="v">회장 기예람</span><span class="s"><a href="tel:010-5219-4761">010-5219-4761</a></span></div>
</div>
</div>
</template>

<template id="s4">
<div class="stack" style="width:100%;max-width:640px;gap:28px">
<span class="kicker en fu" style="animation-delay:.1s">R.S.V.P.</span>
<h2 class="title-xl en fu" style="font-size:clamp(52px,7vw,92px);line-height:1.02;animation-delay:.3s">Da capo,<br>with you.</h2>
<p class="fu" style="margin:0;font-size:15px;font-weight:300;line-height:1.9;color:var(--soft);animation-delay:.7s">처음으로 돌아가 다시 한번, 선배님과 함께.<br>11월 15일까지 참석 여부를 알려 주시면<br>정성껏 준비하겠습니다.</p>
<div class="stack fu" style="gap:14px;animation-delay:1s">
<a class="btn btn-solid" href="https://docs.google.com/forms/d/1st1KZ6C_9PJiu6msqdtS7u8Ca_kYA7UxjfSQTjQ4tRM/viewform" target="_blank" rel="noopener">참석 회신서 작성하기</a>
<span style="font-size:13px;font-weight:300;color:var(--muted)">성함 · 기수 · 연락처 · 참석 여부를 남겨 주세요</span>
</div>
</div>
</template>

<script>
(function () {
  var labels = ['Overture', 'I. Invitation', 'II. Programme', 'III. Information', 'IV. R.S.V.P.'];
  var stage = document.getElementById('stage');
  var nav = document.getElementById('nav');
  var label = document.getElementById('label');
  var dots = nav.querySelectorAll('.dots i');
  var nextBtn = document.getElementById('next');
  var restartBtn = document.getElementById('restart');
  var step = 0, opening = false;

  function render() {
    stage.innerHTML = '';
    stage.appendChild(document.getElementById('s' + step).content.cloneNode(true));
    label.textContent = labels[step];
    nav.hidden = step === 0;
    nextBtn.hidden = step === 4;
    restartBtn.hidden = step !== 4;
    for (var i = 0; i < dots.length; i++) dots[i].classList.toggle('on', i + 1 === step);
    window.scrollTo(0, 0);
    if (step === 0) {
      document.getElementById('open').addEventListener('click', function () {
        if (opening) return;
        opening = true;
        document.getElementById('env').classList.add('open');
        setTimeout(function () { opening = false; go(1); }, 2100);
      });
    }
  }
  function go(n) { step = Math.max(0, Math.min(4, n)); render(); }
  document.getElementById('prev').addEventListener('click', function () { go(step - 1); });
  nextBtn.addEventListener('click', function () { go(step + 1); });
  restartBtn.addEventListener('click', function () { go(0); });
  render();
})();
</script>
</body>
</html>
